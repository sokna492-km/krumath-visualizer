# Name used by `npx nitro deploy`. Paths/main are generated in .output after `npm run build`.
# Set your Cloudflare account via `wrangler login` or the CLOUDFLARE_ACCOUNT_ID env var.
name = "math-visualizer"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# More specific than the main `krumath` Worker — must be attached on the krumath.com zone.
routes = [
  { pattern = "krumath.com/math-visualizer*", zone_name = "krumath.com" }
]
